name: PR build artifacts

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows-artifacts:
    name: Windows artifacts
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Verify local branding
        run: node tools/check-local-branding.mjs

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install NSIS
        run: ./scripts/installer/windows/install-nsis.ps1

      - name: Installer contract tests
        run: node --test scripts/installer/contracts.test.mjs

      - name: Install frontend dependencies
        working-directory: apps/alunixa-x-manager
        run: npm ci

      - name: Frontend tests
        working-directory: apps/alunixa-x-manager
        run: npm test

      - name: TypeScript check
        working-directory: apps/alunixa-x-manager
        run: npm run check

      - name: Build frontend
        working-directory: apps/alunixa-x-manager
        run: npm run vite:build

      - name: Rust tests
        run: cargo test --workspace --locked --no-fail-fast -- --test-threads=1

      - name: Build release binaries
        run: cargo build --release --locked

      - name: Package unified Windows app
        shell: pwsh
        run: |
          $version = (Get-Content apps/alunixa-x-manager/package.json -Raw | ConvertFrom-Json).version
          ./scripts/installer/windows/package.ps1 -Version $version

      - name: Upload Windows binaries
        uses: actions/upload-artifact@v4
        with:
          name: alunixa-x-windows-binaries
          path: dist/windows/app/*
          if-no-files-found: error

      - name: Upload Windows installer
        uses: actions/upload-artifact@v4
        with:
          name: alunixa-x-windows-installer
          path: dist/windows/*.exe
          if-no-files-found: error

  macos-dmg:
    name: macOS DMG (${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x64
            runner: macos-15-intel
            target: x86_64-apple-darwin
          - arch: arm64
            runner: macos-14
            target: aarch64-apple-darwin
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install frontend dependencies
        working-directory: apps/alunixa-x-manager
        run: npm ci

      - name: Frontend tests
        working-directory: apps/alunixa-x-manager
        run: npm test

      - name: TypeScript check
        working-directory: apps/alunixa-x-manager
        run: npm run check

      - name: Build frontend
        working-directory: apps/alunixa-x-manager
        run: npm run vite:build

      - name: Rust tests
        run: cargo test --workspace --locked --no-fail-fast -- --test-threads=1

      - name: Build release binaries
        run: cargo build --release --locked --target ${{ matrix.target }}

      - name: Build macOS DMG
        run: |
          set -euo pipefail
          VERSION="$(node -p "require('./apps/alunixa-x-manager/package.json').version")"
          BINARY_DIR="$PWD/target/${{ matrix.target }}/release" bash scripts/installer/macos/package-dmg.sh "$VERSION" "${{ matrix.arch }}"

      - name: Verify macOS bundle structure
        run: |
          set -euo pipefail
          test -L "dist/macos/stage/Applications"
          test "$(readlink "dist/macos/stage/Applications")" = "/Applications"
          VERSION="$(node -p "require('./apps/alunixa-x-manager/package.json').version")"
          python scripts/installer/macos/verify-package.py dist/macos/stage --arch "${{ matrix.arch }}" --version "$VERSION" --require-applications
          for app in "dist/macos/stage/Alunixa X.app" "dist/macos/stage/Alunixa X 管理工具.app"; do
            plutil -lint "$app/Contents/Info.plist" >/dev/null
            codesign --verify --deep --strict "$app"
            echo "verified: $app"
          done

      - name: Upload macOS DMG
        uses: actions/upload-artifact@v4
        with:
          name: alunixa-x-macos-${{ matrix.arch }}-dmg
          path: dist/macos/*.dmg
          if-no-files-found: error
