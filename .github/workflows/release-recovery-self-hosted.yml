name: Release recovery on ephemeral self-hosted runner

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag to publish
        required: true
        type: string
      reuse_run_id:
        description: Successful PR build artifacts run ID for the same tag commit
        required: false
        default: ""
        type: string
      source_repository:
        description: Optional public fork containing a completed release for the same tag commit
        required: false
        default: ""
        type: string
      source_tag:
        description: Release tag in source_repository, normally identical to tag
        required: false
        default: ""
        type: string

permissions:
  contents: write
  actions: read

concurrency:
  group: release-recovery-${{ inputs.tag }}
  cancel-in-progress: false

jobs:
  publish:
    name: Verify, repackage, and publish
    runs-on: [self-hosted, Windows, X64, alunixa-release]
    timeout-minutes: 30
    steps:
      - name: Checkout release tag
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag }}

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Verify tag, versions, branding, and source build
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ inputs.tag }}
          REUSE_RUN_ID: ${{ inputs.reuse_run_id }}
          SOURCE_REPOSITORY: ${{ inputs.source_repository }}
          SOURCE_TAG: ${{ inputs.source_tag }}
        run: |
          $ErrorActionPreference = "Stop"
          if ($env:RELEASE_TAG -notmatch '^[vV][0-9]+\.[0-9]+\.[0-9]+([.-][0-9A-Za-z.-]+)?$') {
            throw "Invalid release tag: $env:RELEASE_TAG"
          }
          $version = $env:RELEASE_TAG.TrimStart('v', 'V')

          $cargo = cargo metadata --no-deps --format-version 1 | ConvertFrom-Json
          $cargoVersions = @($cargo.packages | ForEach-Object version | Sort-Object -Unique)
          if ($cargoVersions.Count -ne 1 -or $cargoVersions[0] -ne $version) {
            throw "Cargo workspace versions do not match $version"
          }

          $packageJson = Get-Content apps/alunixa-x-manager/package.json -Raw | ConvertFrom-Json
          $packageLock = Get-Content apps/alunixa-x-manager/package-lock.json -Raw | ConvertFrom-Json -AsHashtable
          $packageLockRoot = $packageLock['packages']['']
          $tauri = Get-Content apps/alunixa-x-manager/src-tauri/tauri.conf.json -Raw | ConvertFrom-Json
          $versions = @($packageJson.version, $packageLock['version'], $packageLockRoot['version'], $tauri.version)
          if (@($versions | Where-Object { $_ -ne $version }).Count -ne 0) {
            throw "Frontend or Tauri versions do not match $version"
          }

          node tools/check-local-branding.mjs
          if ($LASTEXITCODE -ne 0) {
            throw "Brand verification failed"
          }

          $tagSha = (git rev-parse HEAD).Trim()
          $hasRun = -not [string]::IsNullOrWhiteSpace($env:REUSE_RUN_ID)
          $hasRelease = -not [string]::IsNullOrWhiteSpace($env:SOURCE_REPOSITORY)
          if ($hasRun -eq $hasRelease) {
            throw "Provide exactly one source: reuse_run_id or source_repository/source_tag"
          }

          if ($hasRun) {
            $sourceRun = gh api "repos/$env:GITHUB_REPOSITORY/actions/runs/$env:REUSE_RUN_ID" | ConvertFrom-Json
            if ($sourceRun.name -ne 'PR build artifacts' -or
                $sourceRun.event -ne 'push' -or
                $sourceRun.status -ne 'completed' -or
                $sourceRun.conclusion -ne 'success' -or
                $sourceRun.head_sha -ne $tagSha) {
              throw "Source Actions run is not a successful PR build for tag commit $tagSha"
            }
            "RECOVERY_SOURCE_MODE=run" | Add-Content -LiteralPath $env:GITHUB_ENV -Encoding utf8
          } else {
            if ([string]::IsNullOrWhiteSpace($env:SOURCE_TAG)) {
              throw "source_tag is required with source_repository"
            }
            $sourceRepo = gh api "repos/$env:SOURCE_REPOSITORY" | ConvertFrom-Json
            if (-not $sourceRepo.fork -or
                $sourceRepo.private -or
                $sourceRepo.parent.full_name -ne $env:GITHUB_REPOSITORY) {
              throw "Source repository must be a public fork of $env:GITHUB_REPOSITORY"
            }

            $tagRef = gh api "repos/$env:SOURCE_REPOSITORY/git/ref/tags/$env:SOURCE_TAG" | ConvertFrom-Json
            $tagObject = $tagRef.object
            for ($depth = 0; $depth -lt 4 -and $tagObject.type -eq 'tag'; $depth++) {
              $tagObject = (gh api "repos/$env:SOURCE_REPOSITORY/git/tags/$($tagObject.sha)" | ConvertFrom-Json).object
            }
            if ($tagObject.type -ne 'commit' -or $tagObject.sha -ne $tagSha) {
              throw "Source release tag does not resolve to original tag commit $tagSha"
            }

            $sourceRelease = gh api "repos/$env:SOURCE_REPOSITORY/releases/tags/$env:SOURCE_TAG" | ConvertFrom-Json
            $expectedNames = @(
              "Alunixa-X-$version-windows-x64-setup.exe",
              "Alunixa-X-$version-windows-x64.zip",
              "Alunixa-X-$version-macos-x64.dmg",
              "Alunixa-X-$version-macos-x64.zip",
              "Alunixa-X-$version-macos-arm64.dmg",
              "Alunixa-X-$version-macos-arm64.zip"
            ) | Sort-Object
            $actualNames = @($sourceRelease.assets | Where-Object name -ne 'latest.json' | ForEach-Object name | Sort-Object)
            if ($sourceRelease.draft -or
                $sourceRelease.prerelease -or
                $actualNames.Count -ne 6 -or
                $sourceRelease.assets.Count -notin @(6, 7) -or
                (Compare-Object $expectedNames $actualNames) -or
                @($sourceRelease.assets | Where-Object { $_.state -ne 'uploaded' -or $_.digest -notmatch '^sha256:' }).Count -ne 0) {
              throw "Source release is incomplete or not authoritative"
            }
            "RECOVERY_SOURCE_MODE=release" | Add-Content -LiteralPath $env:GITHUB_ENV -Encoding utf8
            "RECOVERY_SOURCE_REPOSITORY=$env:SOURCE_REPOSITORY" | Add-Content -LiteralPath $env:GITHUB_ENV -Encoding utf8
            "RECOVERY_SOURCE_TAG=$env:SOURCE_TAG" | Add-Content -LiteralPath $env:GITHUB_ENV -Encoding utf8
            $digests = $sourceRelease.assets | Where-Object name -ne 'latest.json' | Select-Object name, digest
            "RECOVERY_SOURCE_DIGESTS=$($digests | ConvertTo-Json -Compress)" | Add-Content -LiteralPath $env:GITHUB_ENV -Encoding utf8
          }

          "VERSION=$version" | Add-Content -LiteralPath $env:GITHUB_ENV -Encoding utf8
          "TAG_SHA=$tagSha" | Add-Content -LiteralPath $env:GITHUB_ENV -Encoding utf8

      - name: Download authoritative build artifacts
        if: ${{ inputs.reuse_run_id != '' }}
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REUSE_RUN_ID: ${{ inputs.reuse_run_id }}
        run: |
          $ErrorActionPreference = "Stop"
          New-Item -ItemType Directory -Force dist/reused | Out-Null
          gh run download $env:REUSE_RUN_ID --repo $env:GITHUB_REPOSITORY --dir dist/reused
          if ($LASTEXITCODE -ne 0) {
            throw "Artifact download failed"
          }
          @(
            'dist/reused/alunixa-x-windows-installer',
            'dist/reused/alunixa-x-windows-binaries',
            'dist/reused/alunixa-x-macos-x64-dmg',
            'dist/reused/alunixa-x-macos-arm64-dmg'
          ) | ForEach-Object {
            if (-not (Test-Path -LiteralPath $_ -PathType Container)) {
              throw "Required artifact directory missing: $_"
            }
          }

      - name: Ensure NSIS compiler
        if: ${{ inputs.reuse_run_id != '' }}
        run: ./scripts/installer/windows/install-nsis.ps1

      - name: Repackage six versioned release assets
        if: ${{ inputs.reuse_run_id != '' }}
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          New-Item -ItemType Directory -Force dist/release, dist/extracted | Out-Null
          ./scripts/installer/windows/package.ps1 -Version $env:VERSION -BinaryDir dist/reused/alunixa-x-windows-binaries
          Copy-Item -Path "dist/windows/Alunixa-X-$env:VERSION-windows-x64*" -Destination dist/release/

          $sevenZip = @(
            'C:\Program Files\7-Zip\7z.exe',
            'C:\Program Files (x86)\7-Zip\7z.exe'
          ) | Where-Object { Test-Path -LiteralPath $_ } | Select-Object -First 1
          if (-not $sevenZip) {
            $command = Get-Command 7z.exe -ErrorAction SilentlyContinue
            if ($command) { $sevenZip = $command.Source }
          }
          if (-not $sevenZip) { throw "7z.exe is required to recover verified macOS DMGs" }
          foreach ($arch in @('x64', 'arm64')) {
            $artifactDir = "dist/reused/alunixa-x-macos-$arch-dmg"
            $dmgs = @(Get-ChildItem -LiteralPath $artifactDir -Filter '*.dmg' -File)
            if ($dmgs.Count -ne 1) { throw "Expected one $arch DMG" }
            $dmg = "dist/release/Alunixa-X-$env:VERSION-macos-$arch.dmg"
            Copy-Item -LiteralPath $dmgs[0].FullName -Destination $dmg
            if ((Get-FileHash -Algorithm SHA256 $dmgs[0].FullName).Hash -ne (Get-FileHash -Algorithm SHA256 $dmg).Hash) {
              throw "DMG bytes changed while staging $arch"
            }
            $extractDir = Join-Path (Resolve-Path dist/extracted).Path $arch
            New-Item -ItemType Directory -Force $extractDir | Out-Null
            & $sevenZip x -y $dmgs[0].FullName "-o$extractDir" | Out-Null
            if ($LASTEXITCODE -ne 0) { throw "DMG extraction failed for $arch" }
            python scripts/installer/macos/verify-package.py $extractDir --arch $arch --version $env:VERSION --restore-executable-modes --zip "dist/release/Alunixa-X-$env:VERSION-macos-$arch.zip"
            if ($LASTEXITCODE -ne 0) { throw "AX bundle or ZIP validation failed for $arch" }
          }

      - name: Download verified public-fork release assets
        if: ${{ inputs.source_repository != '' }}
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $ErrorActionPreference = "Stop"
          New-Item -ItemType Directory -Force dist/release | Out-Null
          gh release download $env:RECOVERY_SOURCE_TAG `
            --repo $env:RECOVERY_SOURCE_REPOSITORY `
            --dir dist/release `
            --pattern "Alunixa-X-$env:VERSION-*"
          if ($LASTEXITCODE -ne 0) {
            throw "Source release asset download failed"
          }

      - name: Verify metadata, prepare notes, and publish GitHub Release
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ inputs.tag }}
          REUSE_RUN_ID: ${{ inputs.reuse_run_id }}
        run: |
          $ErrorActionPreference = "Stop"
          if ($env:RECOVERY_SOURCE_DIGESTS) {
            foreach ($asset in ($env:RECOVERY_SOURCE_DIGESTS | ConvertFrom-Json)) {
              $actual = (Get-FileHash -Algorithm SHA256 (Join-Path dist/release $asset.name)).Hash.ToLowerInvariant()
              if ("sha256:$actual" -ne $asset.digest) { throw "Source asset digest mismatch: $($asset.name)" }
            }
          }
          node scripts/installer/release-assets.mjs latest $env:RELEASE_TAG
          if ($LASTEXITCODE -ne 0) { throw "Release assets or metadata are invalid" }
          node scripts/installer/release-assets.mjs notes $env:RELEASE_TAG
          if ($LASTEXITCODE -ne 0) { throw "Versioned release notes are invalid" }
          $notes = Join-Path $env:RUNNER_TEMP 'alunixa-x-release-notes.md'
          $title = (Get-Content -LiteralPath $notes -TotalCount 1) -replace '^# ', ''
          $files = @(Get-ChildItem -LiteralPath dist/release -File | ForEach-Object FullName)
          if ($files.Count -ne 7) { throw "Expected six installation files plus latest.json" }
          gh release view $env:RELEASE_TAG --repo $env:GITHUB_REPOSITORY *> $null
          if ($LASTEXITCODE -eq 0) {
            gh release upload $env:RELEASE_TAG $files --clobber --repo $env:GITHUB_REPOSITORY
            if ($LASTEXITCODE -ne 0) { throw "GitHub Release upload failed" }
            gh release edit $env:RELEASE_TAG --repo $env:GITHUB_REPOSITORY --title $title --notes-file $notes --latest
          } else {
            gh release create $env:RELEASE_TAG $files --repo $env:GITHUB_REPOSITORY --verify-tag --title $title --notes-file $notes --latest
          }
          if ($LASTEXITCODE -ne 0) { throw "GitHub Release publish failed" }
