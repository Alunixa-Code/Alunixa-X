name: Deploy documentation site

on:
  push:
    branches: [main]
    paths:
      - "docs/**"
      - "apps/alunixa-x-manager/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Check Pages configuration
        id: pages
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh api "repos/$GITHUB_REPOSITORY/pages" --silent; then
            echo "configured=true" >> "$GITHUB_OUTPUT"
          else
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "GitHub Pages is not configured for this repository; site validation still runs."
          fi
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Validate site
        run: node --test docs/site.test.cjs
      - name: Install manager dependencies
        run: npm ci --prefix apps/alunixa-x-manager
      - name: Build interactive manager preview
        run: npm --prefix apps/alunixa-x-manager run web:build
      - uses: actions/configure-pages@v5
        if: steps.pages.outputs.configured == 'true'
      - uses: actions/upload-pages-artifact@v3
        if: steps.pages.outputs.configured == 'true'
        with:
          path: docs
      - name: Deploy
        id: deployment
        if: steps.pages.outputs.configured == 'true'
        uses: actions/deploy-pages@v4
