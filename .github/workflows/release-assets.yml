name: Build and publish release

on:
  push:
    tags:
      - "v[0-9]*"
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag to build
        required: true
        type: string
      reuse_run_id:
        description: Optional successful PR build artifacts run ID to reuse instead of rebuilding
        required: false
        default: ""
        type: string

permissions:
  contents: write
  actions: read

env:
  RELEASE_TAG: ${{ inputs.tag || github.ref_name }}

jobs:
  verify-version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      tag_sha: ${{ steps.version.outputs.tag_sha }}
    steps:
      - name: Checkout release tag
        uses: actions/checkout@v4
        with:
          ref: ${{ env.RELEASE_TAG }}

      - name: Verify tag and project versions
        id: version
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REPOSITORY" = "Alunixa-Code/Alunixa-X"
          TAG="$RELEASE_TAG"
          VERSION="${TAG#v}"
          VERSION="${VERSION#V}"
          [[ "$TAG" =~ ^[vV][0-9]+\.[0-9]+\.[0-9]+([.-][0-9A-Za-z.-]+)?$ ]]

          mapfile -t CARGO_VERSIONS < <(cargo metadata --no-deps --format-version 1 | jq -r '.packages[].version' | sort -u)
          test "${#CARGO_VERSIONS[@]}" -eq 1
          test "${CARGO_VERSIONS[0]}" = "$VERSION"

          VERSION="$VERSION" node <<'NODE'
          const fs = require("fs");
          const expected = process.env.VERSION;
          const packageJson = JSON.parse(fs.readFileSync("apps/alunixa-x-manager/package.json", "utf8"));
          const packageLock = JSON.parse(fs.readFileSync("apps/alunixa-x-manager/package-lock.json", "utf8"));
          const tauri = JSON.parse(fs.readFileSync("apps/alunixa-x-manager/src-tauri/tauri.conf.json", "utf8"));
          const actual = {
            "package.json": packageJson.version,
            "package-lock.json": packageLock.version,
            "package-lock root": packageLock.packages?.[""]?.version,
            "tauri.conf.json": tauri.version,
          };
          for (const [file, version] of Object.entries(actual)) {
            if (version !== expected) {
              throw new Error(`${file} version ${version} does not match tag version ${expected}`);
            }
          }
          NODE

          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag_sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Verify local branding
        run: node tools/check-local-branding.mjs

      - name: Setup Node for release metadata
        uses: actions/setup-node@v4
        with:
          node-version: "22"

  windows:
    name: Windows x64
    needs: verify-version
    if: ${{ github.event_name != 'workflow_dispatch' || inputs.reuse_run_id == '' }}
    runs-on: windows-latest
    steps:
      - name: Checkout release tag
        uses: actions/checkout@v4
        with:
          ref: ${{ env.RELEASE_TAG }}

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: apps/alunixa-x-manager/package-lock.json

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install NSIS
        run: ./scripts/installer/windows/install-nsis.ps1

      - name: Installer contract tests
        run: node --test scripts/installer/contracts.test.mjs

      - name: Install frontend dependencies
        working-directory: apps/alunixa-x-manager
        run: npm ci

      - name: Build frontend
        working-directory: apps/alunixa-x-manager
        run: npm run vite:build

      - name: Validate frontend
        working-directory: apps/alunixa-x-manager
        run: |
          npm test
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          npm run check
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node ../../tools/i18n-verify.mjs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Rust workspace regression tests
        run: cargo test --workspace --locked --no-fail-fast -- --test-threads=1

      - name: Build binaries
        run: cargo build --release --locked

      - name: Build Windows assets
        shell: pwsh
        run: |
          ./scripts/installer/windows/package.ps1 -Version "${{ needs.verify-version.outputs.version }}"

      - name: Upload Windows workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: release-windows-x64
          path: |
            dist/windows/*.exe
            dist/windows/*.zip
          if-no-files-found: error

  macos:
    name: macOS ${{ matrix.arch }}
    needs: verify-version
    if: ${{ github.event_name != 'workflow_dispatch' || inputs.reuse_run_id == '' }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x64
            runner: macos-15-intel
            target: x86_64-apple-darwin
          - arch: arm64
            runner: macos-14
            target: aarch64-apple-darwin
    steps:
      - name: Checkout release tag
        uses: actions/checkout@v4
        with:
          ref: ${{ env.RELEASE_TAG }}

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: apps/alunixa-x-manager/package-lock.json

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install frontend dependencies
        working-directory: apps/alunixa-x-manager
        run: npm ci

      - name: Build frontend
        working-directory: apps/alunixa-x-manager
        run: npm run vite:build

      - name: Validate frontend
        working-directory: apps/alunixa-x-manager
        shell: bash
        run: |
          set -euo pipefail
          npm test
          npm run check
          node ../../tools/i18n-verify.mjs

      - name: Rust workspace regression tests
        run: cargo test --workspace --locked --no-fail-fast -- --test-threads=1

      - name: Build binaries
        run: cargo build --release --locked --target ${{ matrix.target }}

      - name: Build macOS assets
        shell: bash
        run: |
          set -euo pipefail
          VERSION="${{ needs.verify-version.outputs.version }}"
          BINARY_DIR="$PWD/target/${{ matrix.target }}/release" bash scripts/installer/macos/package-dmg.sh "$VERSION" "${{ matrix.arch }}"
          python scripts/installer/macos/verify-package.py dist/macos/stage --arch "${{ matrix.arch }}" --version "$VERSION" --zip "dist/macos/Alunixa-X-${VERSION}-macos-${{ matrix.arch }}.zip"

      - name: Verify macOS bundle structure
        shell: bash
        run: |
          set -euo pipefail
          test -L "dist/macos/stage/Applications"
          test "$(readlink "dist/macos/stage/Applications")" = "/Applications"
          for app in "dist/macos/stage/Alunixa X.app" "dist/macos/stage/Alunixa X 管理工具.app"; do
            test -f "$app/Contents/Info.plist"
            test -f "$app/Contents/PkgInfo"
            test -x "$app/Contents/MacOS/$(/usr/libexec/PlistBuddy -c 'Print :CFBundleExecutable' "$app/Contents/Info.plist")"
            plutil -lint "$app/Contents/Info.plist" >/dev/null
            codesign --verify --deep --strict "$app"
          done
          test -x "dist/macos/stage/Alunixa X.app/Contents/MacOS/alunixa-x-imagegen-mcp"

      - name: Upload macOS workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: release-macos-${{ matrix.arch }}
          path: |
            dist/macos/*.dmg
            dist/macos/*.zip
          if-no-files-found: error

  publish:
    name: Publish GitHub Release
    needs:
      - verify-version
      - windows
      - macos
    if: ${{ github.event_name != 'workflow_dispatch' || inputs.reuse_run_id == '' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout release notes and scripts
        uses: actions/checkout@v4
        with:
          ref: ${{ env.RELEASE_TAG }}

      - name: Download all release assets
        uses: actions/download-artifact@v4
        with:
          pattern: release-*
          path: dist/release
          merge-multiple: true

      - name: Setup Node for release metadata
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Verify release assets
        shell: bash
        run: |
          set -euo pipefail
          VERSION="${{ needs.verify-version.outputs.version }}"
          test "$(find dist/release -maxdepth 1 -type f | wc -l)" -eq 6
          test -s "dist/release/Alunixa-X-${VERSION}-windows-x64-setup.exe"
          test -s "dist/release/Alunixa-X-${VERSION}-windows-x64.zip"
          test -s "dist/release/Alunixa-X-${VERSION}-macos-x64.dmg"
          test -s "dist/release/Alunixa-X-${VERSION}-macos-x64.zip"
          test -s "dist/release/Alunixa-X-${VERSION}-macos-arm64.dmg"
          test -s "dist/release/Alunixa-X-${VERSION}-macos-arm64.zip"

      - name: Generate and verify static update metadata
        run: node scripts/installer/release-assets.mjs latest "$RELEASE_TAG"

      - name: Prepare detailed versioned release notes
        shell: bash
        run: bash scripts/release/prepare-notes.sh

      - name: Create or update GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REPOSITORY" = "Alunixa-Code/Alunixa-X"
          NOTES="$RUNNER_TEMP/alunixa-x-release-notes.md"
          test -s "$NOTES"
          TITLE="$(head -n 1 "$NOTES" | sed 's/^# //;s/\r$//')"
          [[ "$TITLE" == "Alunixa X $RELEASE_TAG"* ]]
          if gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" dist/release/* --clobber --repo "$GITHUB_REPOSITORY"
            gh release edit "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --title "$TITLE" --notes-file "$NOTES" --latest
          else
            gh release create "$RELEASE_TAG" dist/release/* \
              --repo "$GITHUB_REPOSITORY" \
              --verify-tag \
              --title "$TITLE" \
              --notes-file "$NOTES" --latest
          fi

  publish-reused:
    name: Publish verified existing build artifacts
    needs: verify-version
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.reuse_run_id != '' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout release tag
        uses: actions/checkout@v4
        with:
          ref: ${{ env.RELEASE_TAG }}

      - name: Setup Node for release metadata
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Verify source build run
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REUSE_RUN_ID: ${{ inputs.reuse_run_id }}
          EXPECTED_SHA: ${{ needs.verify-version.outputs.tag_sha }}
        shell: bash
        run: |
          set -euo pipefail
          RUN_JSON="$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$REUSE_RUN_ID")"
          test "$(jq -r '.name' <<<"$RUN_JSON")" = "PR build artifacts"
          test "$(jq -r '.event' <<<"$RUN_JSON")" = "push"
          test "$(jq -r '.status' <<<"$RUN_JSON")" = "completed"
          test "$(jq -r '.conclusion' <<<"$RUN_JSON")" = "success"
          test "$(jq -r '.head_sha' <<<"$RUN_JSON")" = "$EXPECTED_SHA"

      - name: Download successful build artifacts
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REUSE_RUN_ID: ${{ inputs.reuse_run_id }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist/reused
          gh run download "$REUSE_RUN_ID" \
            --repo "$GITHUB_REPOSITORY" \
            --dir dist/reused
          test -d dist/reused/alunixa-x-windows-installer
          test -d dist/reused/alunixa-x-windows-binaries
          test -d dist/reused/alunixa-x-macos-x64-dmg
          test -d dist/reused/alunixa-x-macos-arm64-dmg

      - name: Repackage verified assets for the release tag
        env:
          VERSION: ${{ needs.verify-version.outputs.version }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist/release dist/extracted

          mapfile -t INSTALLERS < <(find dist/reused/alunixa-x-windows-installer -maxdepth 1 -type f -name '*.exe' | sort)
          test "${#INSTALLERS[@]}" -eq 1

          WINDOWS_BIN_DIR=dist/reused/alunixa-x-windows-binaries
          mkdir -p dist/windows/app
          for binary in alunixa-x-plus.exe alunixa-x-imagegen-mcp.exe; do
            test -f "$WINDOWS_BIN_DIR/$binary"
            file "$WINDOWS_BIN_DIR/$binary" | grep -F 'PE32+' >/dev/null
            cp "$WINDOWS_BIN_DIR/$binary" "dist/windows/app/$binary"
          done
          (
            cd "$WINDOWS_BIN_DIR"
            zip -9 -j "$GITHUB_WORKSPACE/dist/release/Alunixa-X-${VERSION}-windows-x64.zip" \
              alunixa-x-plus.exe \
              alunixa-x-imagegen-mcp.exe
          )

          REQUIRED_PACKAGES=()
          command -v 7z >/dev/null 2>&1 || REQUIRED_PACKAGES+=(p7zip-full)
          command -v makensis >/dev/null 2>&1 || REQUIRED_PACKAGES+=(nsis)
          if [ "${#REQUIRED_PACKAGES[@]}" -gt 0 ]; then
            sudo apt-get update
            sudo apt-get install -y "${REQUIRED_PACKAGES[@]}"
          fi

          (
            cd scripts/installer/windows
            makensis -INPUTCHARSET UTF8 "-DVERSION=${VERSION}" AlunixaX.nsi
          )
          test -s "dist/windows/Alunixa-X-${VERSION}-windows-x64-setup.exe"
          cp "dist/windows/Alunixa-X-${VERSION}-windows-x64-setup.exe" dist/release/

          package_macos_zip() {
            local arch="$1"
            local expected_file_arch="$2"
            local artifact_dir="dist/reused/alunixa-x-macos-${arch}-dmg"
            local extract_dir="dist/extracted/${arch}"
            local dmg
            mapfile -t DMGS < <(find "$artifact_dir" -maxdepth 1 -type f -name '*.dmg' | sort)
            test "${#DMGS[@]}" -eq 1
            dmg="${DMGS[0]}"
            cp "$dmg" "dist/release/Alunixa-X-${VERSION}-macos-${arch}.dmg"
            mkdir -p "$extract_dir"
            7z x -y "$dmg" "-o${extract_dir}" >/dev/null
            python scripts/installer/macos/verify-package.py "$extract_dir" --arch "$arch" --version "$VERSION" --restore-executable-modes --zip "dist/release/Alunixa-X-${VERSION}-macos-${arch}.zip"
          }

          package_macos_zip x64 x86_64
          package_macos_zip arm64 arm64

      - name: Verify six release assets
        env:
          VERSION: ${{ needs.verify-version.outputs.version }}
        shell: bash
        run: |
          set -euo pipefail
          EXPECTED=(
            "Alunixa-X-${VERSION}-windows-x64-setup.exe"
            "Alunixa-X-${VERSION}-windows-x64.zip"
            "Alunixa-X-${VERSION}-macos-x64.dmg"
            "Alunixa-X-${VERSION}-macos-x64.zip"
            "Alunixa-X-${VERSION}-macos-arm64.dmg"
            "Alunixa-X-${VERSION}-macos-arm64.zip"
          )
          test "$(find dist/release -maxdepth 1 -type f | wc -l)" -eq 6
          for asset in "${EXPECTED[@]}"; do
            test -s "dist/release/$asset"
          done
          sha256sum "${EXPECTED[@]/#/dist/release/}"

      - name: Generate and verify static update metadata
        run: node scripts/installer/release-assets.mjs latest "$RELEASE_TAG"

      - name: Prepare detailed versioned release notes
        shell: bash
        run: bash scripts/release/prepare-notes.sh

      - name: Create or update GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REPOSITORY" = "Alunixa-Code/Alunixa-X"
          NOTES="$RUNNER_TEMP/alunixa-x-release-notes.md"
          test -s "$NOTES"
          TITLE="$(head -n 1 "$NOTES" | sed 's/^# //;s/\r$//')"
          [[ "$TITLE" == "Alunixa X $RELEASE_TAG"* ]]
          if gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" dist/release/* --clobber --repo "$GITHUB_REPOSITORY"
            gh release edit "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --title "$TITLE" --notes-file "$NOTES" --latest
          else
            gh release create "$RELEASE_TAG" dist/release/* \
              --repo "$GITHUB_REPOSITORY" \
              --verify-tag \
              --title "$TITLE" \
              --notes-file "$NOTES" --latest
          fi
